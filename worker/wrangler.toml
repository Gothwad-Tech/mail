# =============================================================================
# Gothwad Mail Worker config. NO SECRETS IN THIS FILE.
# 100% Cloudflare native: Workers + D1 (`mail` database). Zero Supabase.
#
# THIS FILE IS THE SOURCE OF TRUTH. Whatever is typed in the Cloudflare
# dashboard under "Variables" (plain text) is overwritten by the next deploy;
# only encrypted "Secrets" survive a deploy untouched. `keep_vars = true`
# below stops a deploy from deleting dashboard variables that are NOT listed
# here.
#
# Secrets (never in this file; set in the dashboard as type "Secret", or from
# your machine with `npm run worker:secrets`):
#   ACCOUNTS_INTERNAL_TOKEN     same value as MAIL_INTERNAL_TOKEN in Accounts
#   RESEND_API_KEY              re_...
#
# See which secret NAMES the deployed Worker has (names only, never values):
#   npm run worker:secrets:list
#
# Route (production): mail.gothwadtech.com/api/*  -> this Worker
# Email Routing (catch-all *@gothwadtech.com)     -> this Worker's email() handler
# See docs/SETUP.md for the dashboard steps.
# =============================================================================

# Must match the dashboard Worker name exactly (`mail`). Workers Builds deploys to
# the dashboard's Worker and overrides this name with WRANGLER_CI_OVERRIDE_NAME, but
# `npm run worker:secrets:list` / `worker:deploy` use THIS name - so a mismatch sends
# local CLI commands to the wrong (or a different) Worker. Do not rename it.
name = "mail"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# Do not delete dashboard-only variables on deploy (text vars are removed by
# default). Secrets are never deleted by a deploy either way.
keep_vars = true

# -----------------------------------------------------------------------------
# Cloudflare D1 (the `mail` database created in the dashboard).
# The Worker creates its own tables on the first request (idempotent), so a
# brand-new empty D1 database works with zero manual SQL. `sql/` has the same
# schema for humans who prefer the dashboard console.
# -----------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "mail"
database_id = "87854cea-7feb-46f3-ab99-2a2137f31105"

[vars]
APP_DOMAIN = "gothwadtech.com"
# AUTH_HUB_URL = base for every SERVER-side Accounts call (/api/auth/me,
# /api/oauth/userinfo, /api/internal/usernames/:username). It must be a host
# that reaches the Accounts Worker, so it is Accounts' Custom Domain. Cloudflare
# does not run a same-zone Worker behind a Pages host for a server-to-server
# call: accounts.gothwadtech.com answers HTML there and Mail reports 503
# accounts_unexpected_response.
AUTH_HUB_URL = "https://api.gothwadtech.com"
# AUTH_SIGNIN_URL = browser-facing Accounts links only (sign-in redirect,
# accountUrl). Optional; falls back to AUTH_HUB_URL when unset.
AUTH_SIGNIN_URL = "https://accounts.gothwadtech.com"
MAIL_URL = "https://mail.gothwadtech.com"
ENVIRONMENT = "production"
# Extra allowed origins, comma-separated (e.g. a Pages preview URL). Empty = none.
ALLOWED_ORIGINS = ""
# Per-user, per-UTC-day send cap. Resend free plan = 3,000 emails/month total.
DAILY_SEND_LIMIT = "30"
# Inbound messages above this size are rejected at SMTP time (10 MB).
MAX_INBOUND_BYTES = "10485760"
