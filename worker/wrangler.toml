# =============================================================================
# Gothwad Mail Worker config. NO SECRETS IN THIS FILE.
#
# Secrets (set in the dashboard or with `wrangler secret put`):
#   ACCOUNTS_INTERNAL_TOKEN     (same value as MAIL_INTERNAL_TOKEN in Accounts;
#                               set with `wrangler secret put ACCOUNTS_INTERNAL_TOKEN`)
#   SUPABASE_SERVICE_ROLE_KEY   (sb_secret_... or legacy eyJ... service_role)
#   RESEND_API_KEY              (re_...)
#
# Before the first deploy, replace SUPABASE_URL with your project URL.
# That is public config, not a secret. The Worker refuses to call Supabase
# while the placeholder is still in place.
#
# Route (production): mail.gothwadtech.com/api/*  -> this Worker
# Email Routing (catch-all *@gothwadtech.com)     -> this Worker's email() handler
# See docs/SETUP.md for the dashboard steps.
# =============================================================================

name = "gothwad-mail-api"
main = "src/index.ts"
compatibility_date = "2025-09-01"

[vars]
APP_DOMAIN = "gothwadtech.com"
# AUTH_HUB_URL = base for every SERVER-side Accounts call (/api/auth/me,
# /api/oauth/userinfo, /api/internal/usernames/:username). It must be a host
# that reaches the Accounts Worker, so it is Accounts' Custom Domain. Cloudflare
# does not run a same-zone Worker behind a Pages host for a server-to-server
# call: accounts.gothwadtech.com answers HTML there and Mail reports 503
# accounts_unexpected_response.
AUTH_HUB_URL = "https://api.gothwadtech.com"
# AUTH_SIGNIN_URL = browser-facing Accounts links only (sign-in redirect,
# accountUrl). Optional; falls back to AUTH_HUB_URL when unset.
AUTH_SIGNIN_URL = "https://accounts.gothwadtech.com"
MAIL_URL = "https://mail.gothwadtech.com"
SUPABASE_URL = "https://YOUR_PROJECT_REF.supabase.co"
ENVIRONMENT = "production"
# Extra allowed origins, comma-separated (e.g. a Pages preview URL). Empty = none.
ALLOWED_ORIGINS = ""
# Per-user, per-UTC-day send cap. Resend free plan = 3,000 emails/month total.
DAILY_SEND_LIMIT = "30"
# Inbound messages above this size are rejected at SMTP time (10 MB).
MAX_INBOUND_BYTES = "10485760"
